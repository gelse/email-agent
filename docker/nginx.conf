# M0T4/M1T8 dev edge (Q-A13): one origin, two listeners.
#
#   :80  — plain HTTP. Container-internal healthcheck (web's
#          `wget http://localhost/health/live`) plus the host-published
#          WEB_PORT that health/metrics tooling (scripts/smoke.sh) uses.
#   :443 — HTTPS with the throwaway self-signed dev certificate
#          (docker/certs, generated by scripts/gen-dev-cert.sh). This is the
#          browser-facing dev edge: it simulates the prod/testing posture
#          where traefik terminates TLS externally in front of the stack
#          (the api container itself always speaks plain HTTP).
#
# Both listeners serve the SAME server-level config from
# snippets/shared-server.conf (root, gzip, SPA fallback, API proxy) so the
# two blocks cannot drift. The shared proxy locations forward
# `X-Forwarded-Proto $scheme` — http on :80, https on :443 — which the api
# honours via UseForwardedHeaders (Q-A13). Host is forwarded as $http_host
# (M1T8 fix) so the refresh-path Origin gate sees the browser's own origin.
#
# Prerequisite: docker/certs/dev-selfsigned.{crt,key} must exist or nginx
# refuses to start — run `bash scripts/gen-dev-cert.sh` first.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    include /etc/nginx/snippets/shared-server.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/dev-selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/shared-server.conf;
}
