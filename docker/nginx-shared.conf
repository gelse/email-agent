# Shared server-level config for BOTH dev edge listeners (see default.conf).
# Included once per server block — :80 and :443 — so their locations cannot
# drift apart (Q-A13).

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_vary on;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/wasm
    application/xml
    image/svg+xml;

# M1T8 (§13.9 same-origin dev topology): the SPA and the API are one origin
# from the browser's point of view — /v1/*, /health/* and /metrics reverse-
# proxy to the api container on the internal Docker network (the api service
# publishes no host port in dev). Host MUST be forwarded so the Origin gate
# on /v1/account/refresh sees the browser's own origin (localhost:8443 over
# HTTPS, localhost:8081 over HTTP) as same-origin. X-Forwarded-Proto carries
# $scheme of THIS listener (http on :80, https on :443) and is honoured by
# the api (UseForwardedHeaders, Q-A13). X-Forwarded-For uses
# $proxy_add_x_forwarded_for, which APPENDS nginx's own $remote_addr as the
# rightmost entry: the api (ForwardLimit=1) consumes exactly that observed
# address and ignores any client-supplied values to its left.

location = /health/live {
    # The web container answers its own liveness statically so the web
    # healthcheck never depends on the api container (avoids a startup
    # cycle); everything else under /health/ (e.g. /health/ready) proxies.
    access_log off;
    return 200;
}

location /v1/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streaming/SSE (M5) and problem documents must not be buffered.
    proxy_buffering off;
}

location /health/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /metrics {
    proxy_pass http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /_framework/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Blazor WASM SPA fallback (M0T4; the bundle is published by the Dockerfile
# spa stage from src/EmailAgent.Spa).
location / {
    try_files $uri $uri/ /index.html;
}
