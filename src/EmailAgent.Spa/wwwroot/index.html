<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmailAgent.Spa</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EmailAgent.Spa.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <!-- M5T1 (SQ-M5-1 / Q-O28): the browser-side unlock crypto. The vendored
         argon2-browser bundle carries its WASM inline (no runtime download,
         works behind the compose stack's nginx), and unlock-crypto.js exposes
         emailAgent.deriveKek / emailAgent.unwrapDek to the Blazor
         IUnlockCrypto implementation. Loaded before the framework so the
         globals exist by the time the SPA can ask for an unlock. -->
    <script src="js/argon2-bundled.min.js"></script>
    <script src="js/unlock-crypto.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
